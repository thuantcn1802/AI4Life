<!-- templates/admin_users.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Users</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6">
  <h1 class="text-2xl font-bold">Danh sách users</h1>
  <table class="min-w-full bg-white mt-4">
    <thead><tr><th>Email</th><th>Role</th><th>Verified</th></tr></thead>
    <tbody>
      {% for u in users %}
        <tr>
          <td class="p-2">{{ u.email }}</td>
          <td class="p-2">{{ u.role }}</td>
          <td class="p-2">{{ 'Yes' if u.verified_by_admin else 'No' }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
