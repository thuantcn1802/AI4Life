<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - SkinCare AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'medical-teal': '#8CDAD4',
                        'medical-dark': '#2D8B84',
                        'medical-btn': '#5BBFB2',
                        'medical-btn-hover': '#4DA398',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50 flex font-sans">

    <div class="hidden md:flex md:w-1/2 bg-medical-teal relative overflow-hidden items-center justify-center">
        <div class="absolute inset-0 bg-gradient-to-tr from-teal-600/60 to-medical-teal/40 z-10"></div>
        
        <img src="https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?q=80&w=2070&auto=format&fit=crop" 
             alt="Medical Background" 
             class="absolute inset-0 w-full h-full object-cover">

        <div class="relative z-20 text-white p-12 max-w-lg">
            <h2 class="text-4xl font-bold mb-6 leading-tight">Chăm sóc làn da của bạn với AI</h2>
            <p class="text-lg text-white/90">Hệ thống chẩn đoán và theo dõi sức khỏe da thông minh, nhanh chóng và chính xác.</p>
        </div>
    </div>

    <div class="w-full md:w-1/2 flex items-center justify-center p-8 bg-white">
        <div class="w-full max-w-md space-y-8">
            
            <div class="text-center">
                <a href="/" class="inline-flex items-center gap-2 text-3xl font-bold text-teal-600 tracking-wide mb-2">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                    SkinCare
                </a>
                <h2 class="text-2xl font-semibold text-gray-800 mt-4">Chào mừng trở lại!</h2>
                <p class="text-sm text-gray-500 mt-2">Vui lòng đăng nhập để tiếp tục</p>
            </div>

            {% if error %}
            <div class="bg-red-50 border border-red-100 text-red-600 px-4 py-3 rounded-lg text-sm flex items-center gap-2 animate-pulse">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-6">
                
                <div class="space-y-1">
                    <label class="block text-sm font-medium text-gray-700 ml-1">Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                        </div>
                        <input
                            type="email"
                            name="email"
                            required
                            placeholder="example@gmail.com"
                            class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-medical-btn focus:ring-2 focus:ring-medical-btn/20 transition-all bg-gray-50 hover:bg-white text-gray-700"
                        />
                    </div>
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center ml-1">
                        <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
                        <a href="#" class="text-xs font-medium text-medical-dark hover:underline">Quên mật khẩu?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <input
                            type="password"
                            name="password"
                            required
                            placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-medical-btn focus:ring-2 focus:ring-medical-btn/20 transition-all bg-gray-50 hover:bg-white text-gray-700"
                        />
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full bg-medical-btn hover:bg-medical-btn-hover text-white py-3.5 rounded-xl font-semibold shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 active:scale-95 duration-200"
                >
                    Đăng nhập
                </button>
            </form>

            <p class="mt-8 text-center text-sm text-gray-600">
                Chưa có tài khoản?
                <a
                    href="{{ url_for('auth.register') }}"
                    class="font-semibold text-medical-dark hover:text-teal-700 hover:underline transition-colors ml-1"
                >
                    Đăng ký ngay
                </a>
            </p>
        </div>
    </div>

</body>
</html>
