<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tư vấn trực tuyến - Skincare</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "medical-teal": "#8CDAD4",
              "medical-dark": "#2D8B84",
              "medical-btn": "#5BBFB2",
              "medical-btn-hover": "#4DA398",
              "chat-bg": "#F0F9F8",
            },
            fontFamily: {
              sans: ['"Be Vietnam Pro"', "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      * { font-family: "Be Vietnam Pro", sans-serif; }
      /* Custom Scrollbar cho tin nhắn đẹp hơn */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
  </head>

  <body class="bg-white h-screen flex flex-col overflow-hidden">
    
    <nav class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 shadow-sm z-20 shrink-0">
        <div class="flex items-center gap-4">
            <a href="/" class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-50 text-gray-500 hover:bg-medical-teal/20 hover:text-medical-dark transition-all">
                <i class="bi bi-arrow-left text-lg"></i>
            </a>
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <h1 class="text-lg font-bold text-gray-800">SkinCare Messenger</h1>
            </div>
        </div>
        <div class="text-sm text-gray-500 hidden sm:block">
            Tư vấn sức khỏe <span class="text-medical-btn font-semibold">24/7</span>
        </div>
    </nav>

    <div class="flex-1 flex overflow-hidden">
        
        <aside class="w-80 bg-white border-r border-gray-100 flex flex-col hidden md:flex z-10" id="sidebarList">
            <div class="p-4 border-b border-gray-100">
                <div class="relative">
                    <input type="text" placeholder="Tìm kiếm cuộc trò chuyện..." class="w-full bg-gray-50 border-none rounded-xl py-2.5 pl-10 pr-4 text-sm focus:ring-2 focus:ring-medical-btn/50 outline-none transition-all">
                    <i class="bi bi-search absolute left-3.5 top-3 text-gray-400"></i>
                </div>
            </div>
            
            <div id="conversationList" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                <div class="flex flex-col items-center justify-center h-40 text-gray-400">
                    <div class="w-6 h-6 border-2 border-gray-200 border-t-medical-btn rounded-full animate-spin mb-2"></div>
                    <span class="text-xs">Đang tải dữ liệu...</span>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-chat-bg relative w-full">
            
            <div id="chatHeader" class="h-16 bg-white/90 backdrop-blur-sm border-b border-gray-100 flex items-center justify-between px-6 shrink-0" style="display:none !important;">
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-medical-btn to-medical-dark flex items-center justify-center text-white font-bold shadow-md shadow-teal-100">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
                    </div>
                    <div>
                        <h2 id="chatUserName" class="text-gray-900 font-bold text-sm leading-tight">Đang kết nối...</h2>
                        <span class="text-xs text-medical-btn font-medium">Đang hoạt động</span>
                    </div>
                </div>
                <button class="text-gray-400 hover:text-medical-dark transition-colors">
                    <i class="bi bi-info-circle-fill text-xl"></i>
                </button>
            </div>

            <div id="messagesList" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 custom-scrollbar flex flex-col">
                <div class="flex-1 flex flex-col items-center justify-center text-center opacity-50">
                    <div class="w-20 h-20 bg-teal-100 rounded-full flex items-center justify-center mb-4 text-medical-dark">
                        <i class="bi bi-chat-heart-fill text-3xl"></i>
                    </div>
                    <p class="text-gray-600 font-medium">Chọn một cuộc hội thoại để bắt đầu</p>
                </div>
            </div>

            <div class="p-4 bg-white border-t border-gray-100 shrink-0">
                <form id="chatForm" class="flex items-end gap-3 max-w-4xl mx-auto w-full" style="display:none;">
                    
                    <label class="cursor-pointer group pb-1">
                        <div class="w-10 h-10 rounded-full bg-gray-50 text-gray-500 hover:bg-teal-50 hover:text-medical-btn flex items-center justify-center transition-all border border-transparent hover:border-teal-100">
                            <i class="bi bi-image text-lg"></i>
                        </div>
                        <input type="file" id="imageInput" accept="image/*" hidden>
                    </label>
                    
                    <div class="flex-1 bg-gray-50 rounded-2xl border border-gray-200 focus-within:border-medical-btn focus-within:bg-white focus-within:ring-2 focus-within:ring-medical-btn/20 transition-all flex items-center px-4 py-2">
                        <input type="text" id="messageInput" class="w-full bg-transparent border-none focus:ring-0 text-gray-800 text-sm py-2 placeholder-gray-400 outline-none" placeholder="Nhập tin nhắn tư vấn..." disabled autocomplete="off">
                        <i class="bi bi-emoji-smile text-gray-400 hover:text-gray-600 cursor-pointer ml-2"></i>
                    </div>

                    <button type="submit" id="sendBtn" class="w-11 h-11 rounded-full bg-medical-btn hover:bg-medical-dark text-white shadow-lg shadow-teal-200 disabled:opacity-50 disabled:cursor-not-allowed transition-all transform active:scale-95 flex items-center justify-center pb-1" disabled>
                        <i class="bi bi-send-fill text-lg"></i>
                    </button>
                </form>
            </div>

        </main>
    </div>

    <script type="module" src="/static/js/chatbox.js"></script>
    <script>
        window.CURRENT_UID = "{{ current_uid }}";
        window.CURRENT_ROLE = "{{ current_role }}";
        window.TARGET_ID_FROM_URL = "{{ target_id }}";
    </script>
  </body>
</html>
